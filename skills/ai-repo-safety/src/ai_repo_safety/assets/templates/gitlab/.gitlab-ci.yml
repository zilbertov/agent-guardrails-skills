# Owner must supply an audited image pinned by digest, containing Python/scanners,
# and vendor this reviewed fork under .repo-safety/vendor/ai-repo-safety/.
stages: [security]
sast:
  stage: security
  image: $REPO_SAFETY_CI_IMAGE
  script:
    - 'case "$REPO_SAFETY_CI_IMAGE" in *@sha256:*) ;; *) echo "Pin REPO_SAFETY_CI_IMAGE by digest" >&2; exit 2 ;; esac'
    - python .repo-safety/vendor/ai-repo-safety/scripts/repo_safety.py scan --target . --strict
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

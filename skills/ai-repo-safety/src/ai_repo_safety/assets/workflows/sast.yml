name: sast

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  python-sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - name: Install Python scanners
        run: |
          test -f .repo-safety/tooling-requirements.txt || { echo "Provide an owner-reviewed transitive hash lock for scanner tools" >&2; exit 2; }
          python -m pip install --require-hashes --only-binary=:all: -r .repo-safety/tooling-requirements.txt
      - name: Bandit
        run: bandit -q -r src -x tests,.venv,venv
      - name: Ruff
        run: ruff check .
      - name: Lockfile audit
        run: |
          if [ -f uv.lock ]; then
            uv export --frozen --no-dev --no-emit-project -o "$RUNNER_TEMP/reqs.txt"
            pip-audit -r "$RUNNER_TEMP/reqs.txt" --disable-pip
          elif [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --disable-pip
          else
            echo "No uv.lock or requirements.txt; skipping lockfile audit"
          fi

  opengrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Opengrep placeholder
        run: |
          echo "Install Opengrep from official current stable docs, then run:"
          echo "opengrep --error --config .repo-safety/opengrep ."
          echo "Configure a reviewed Opengrep runner; this check has not run." >&2
          exit 2
